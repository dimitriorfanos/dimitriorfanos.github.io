<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: transparent;" version="1.1" width="1045px" height="300px" viewBox="0 0 1045 300">

  <!-- ── CH4 molecule ── -->
  <!-- C atom -->
  <ellipse cx="119" cy="134" rx="20" ry="20" fill="#b3b3b3" stroke="#000000" stroke-width="3"/>
  <text x="119" y="140" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">C</text>
  <!-- H atoms -->
  <ellipse cx="60"  cy="169" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="60"  y="175" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <ellipse cx="130" cy="189" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="130" y="195" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <ellipse cx="180" cy="159" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="180" y="165" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <ellipse cx="119" cy="69"  rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="119" y="75"  text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <!-- C-H bonds -->
  <line x1="68.7"  y1="158.9" x2="100"  y2="142"   stroke="#000000" stroke-width="5"/>
  <line x1="126.4" y1="174.4" x2="119"  y2="144"   stroke="#000000" stroke-width="5"/>
  <line x1="169.9" y1="155.7" x2="137.4" y2="141.7" stroke="#000000" stroke-width="5"/>
  <line x1="118.7" y1="114"   x2="119"  y2="84"    stroke="#000000" stroke-width="5"/>

  <!-- ── Plus/equals cross left of arrow ── -->
  <line x1="245" y1="154"   x2="245" y2="124.5" stroke="#000000" stroke-width="5"/>
  <line x1="230" y1="139"   x2="260" y2="139.5" stroke="#000000" stroke-width="5"/>

  <!-- ── E_MW label ── -->
  <text x="360" y="146" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="31px" font-weight="bold" fill="#000000">E<tspan baseline-shift="-0.25em" font-size="22px">MW</tspan></text>

  <!-- ── Reaction arrow ── -->
  <line x1="440" y1="134.75" x2="566" y2="134.75" stroke="#000000" stroke-width="5"/>
  <polygon points="566,128 580,134.75 566,141.5" fill="#000000" stroke="#000000" stroke-width="5"/>

  <!-- ── H2 molecule (top, y≈102) ── -->
  <ellipse cx="670" cy="102.38" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="670" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <line x1="685" y1="102.38" x2="725" y2="102.38" stroke="#000000" stroke-width="5"/>
  <ellipse cx="740" cy="102.38" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="740" y="108" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>

  <!-- ── Plus/equals cross between H2 and C ── -->
  <line x1="820" y1="149.75" x2="820" y2="120.25" stroke="#000000" stroke-width="5"/>
  <line x1="805" y1="134.75" x2="835" y2="135.25" stroke="#000000" stroke-width="5"/>

  <!-- ── H2 molecule (lower, y≈174) ── -->
  <ellipse cx="670" cy="173.88" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="670" y="179" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>
  <line x1="685" y1="173.88" x2="725" y2="173.88" stroke="#000000" stroke-width="5"/>
  <ellipse cx="740" cy="173.88" rx="15" ry="15" fill="#ffffff" stroke="#000000" stroke-width="3"/>
  <text x="740" y="179" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">H</text>

  <!-- ── C (solid) ── -->
  <ellipse cx="930" cy="137.38" rx="20" ry="20" fill="#b3b3b3" stroke="#000000" stroke-width="3"/>
  <text x="930" y="143" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">C</text>

  <!-- ── Labels below ── -->
  <text x="130" y="278" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">Methane (CH<tspan baseline-shift="-0.25em" font-size="15px">4</tspan>)</text>
  <text x="360" y="270" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">Energy<tspan x="360" dy="22">(from Microwave Plasma)</tspan></text>
  <text x="715" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">Hydrogen (H<tspan baseline-shift="-0.25em" font-size="15px">2</tspan>, gas)</text>
  <text x="930" y="275" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="20px" font-weight="bold" fill="#000000">Carbon (C, solid)</text>

</svg>
