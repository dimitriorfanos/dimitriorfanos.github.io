<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="971" height="241" viewBox="0 0 971 241"
     font-family="Helvetica, Arial, sans-serif" font-size="18" fill="#000000">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0000"/>
    </marker>
  </defs>

  <!-- Table background -->
  <rect x="0" y="0" width="970" height="240" fill="white" stroke="black" stroke-width="1"/>

  <!-- Horizontal dividers -->
  <line x1="0"   y1="60"  x2="970" y2="60"  stroke="black" stroke-width="1"/>
  <line x1="0"   y1="120" x2="970" y2="120" stroke="black" stroke-width="1"/>
  <line x1="0"   y1="180" x2="970" y2="180" stroke="black" stroke-width="1"/>

  <!-- Vertical dividers -->
  <line x1="324" y1="0" x2="324" y2="240" stroke="black" stroke-width="1"/>
  <line x1="646" y1="0" x2="646" y2="240" stroke="black" stroke-width="1"/>

  <!-- Row 1: Headers -->
  <text x="162" y="30" text-anchor="middle" dominant-baseline="central" font-weight="bold">Variable</text>
  <text x="485" y="30" text-anchor="middle" dominant-baseline="central" font-weight="bold">Lab-Scale</text>
  <text x="808" y="30" text-anchor="middle" dominant-baseline="central" font-weight="bold">Pilot-Scale</text>

  <!-- Row 2: Frequency -->
  <text x="162" y="90" text-anchor="middle" dominant-baseline="central">Frequency (MHz)</text>
  <text x="485" y="82" text-anchor="middle" dominant-baseline="central">2450</text>
  <text x="485" y="102" text-anchor="middle" dominant-baseline="central">S-Band</text>
  <text x="808" y="82" text-anchor="middle" dominant-baseline="central">915</text>
  <text x="808" y="102" text-anchor="middle" dominant-baseline="central">L-Band</text>

  <!-- Row 3: Maximum Power -->
  <text x="162" y="150" text-anchor="middle" dominant-baseline="central">Maximum Power (kW)</text>
  <text x="485" y="150" text-anchor="middle" dominant-baseline="central">6</text>
  <text x="808" y="150" text-anchor="middle" dominant-baseline="central">100</text>

  <!-- Row 4: Flow Rates -->
  <text x="162" y="210" text-anchor="middle" dominant-baseline="central">Flow Rates (SLPM)</text>
  <text x="485" y="210" text-anchor="middle" dominant-baseline="central">20 – 100</text>
  <text x="808" y="210" text-anchor="middle" dominant-baseline="central">400 – 1000</text>

  <!-- Annotation backgrounds -->
  <rect x="548" y="66" width="194" height="38" fill="white" opacity="0.92"/>
  <rect x="548" y="129" width="194" height="24" fill="white" opacity="0.92"/>

  <!-- Arrow 1 (Frequency row) -->
  <line x1="560" y1="110" x2="728" y2="110" stroke="#ff0000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 1 label -->
  <text x="645" y="79"  text-anchor="middle" fill="#ff0000" font-size="13">2.67x increase in wavelength</text>
  <text x="645" y="95"  text-anchor="middle" fill="#ff0000" font-size="13">Larger equipment</text>

  <!-- Arrow 2 (Power row) -->
  <line x1="560" y1="160" x2="728" y2="160" stroke="#ff0000" stroke-width="1.5" marker-end="url(#arr)"/>

  <!-- Arrow 2 label -->
  <text x="645" y="146" text-anchor="middle" fill="#ff0000" font-size="13">16.7x power scaling factor</text>
</svg>
